[package]
name = "aptos-e2e"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "server"
path = "src/server.rs"

[[bin]]
name = "client"
path = "src/client.rs"

[dependencies]
x402-rs = { path = "../../", features = ["telemetry"] }
x402-axum = { path = "../../crates/x402-axum" }
x402-reqwest = { path = "../../crates/x402-reqwest" }

# Aptos
aptos-rest-client = { git = "https://github.com/aptos-labs/aptos-core", rev = "fb9e2f4edd387b123c8355474dab2e8e1f4e59dc" }

# Web framework
axum = { version = "0.8" }
tokio = { version = "1.48", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
reqwest = { version = "0.12" }

# Tracing
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
dotenvy = { version = "0.15" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
anyhow = { version = "1.0" }
